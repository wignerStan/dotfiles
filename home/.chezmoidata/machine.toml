# Per-machine declarations, keyed by hostname (chezmoi.hostname; LocalHostName on macOS).
# Add a `user@hostname` entry for a per-account override; it takes precedence
# over the hostname entry during chezmoi init. Nested under [machine] so normal
# templates see .machine."<hostname>".
# The config template reads/parses this source file directly during init because
# chezmoi loads .chezmoidata only after config generation.
# Any axis set here is used when the corresponding CHEZMOI_* env var is absent
# during `chezmoi init`. Unset axes fall back to auto-detection. Re-run init
# after editing this file; use --override-data for a one-off apply.

[machine."s-MacBook-Air-2"]
ownership = "personal"
platform = "local"
tier = "default"
facets = ["dev", "research"]
bootstrap = "full"
deploy = "system+user"
is_guest = false

# Cirrus Labs/Tart base images use this LocalHostName. Keep the guest minimal,
# but retain system+user deployment so the L2 PF security baseline is installed.
[machine."admins-Virtual-Machine"]
ownership = "personal"
platform = "local"
tier = "simple"
facets = []
bootstrap = "basic"
deploy = "system+user"
is_guest = true

[machine."incus"]
ownership = "personal"
platform = "local"
tier = "advanced"
facets = ["dev", "research"]
bootstrap = "full"
deploy = "user"
is_guest = false
# Incus is a physical personal Linux host with a shared multi-user workspace.
shared_workspace = "/develop"
# Keep the mamba root shared, but isolate mutable tool caches per account. The
# profile is user-only, so no root-managed default ACL can be assumed.
shared_cache = "/develop/cache"
# Personal Linux uses the maintained fork rather than the shared distribution
# Homebrew checkout. The user overlay remains private; only the source cache
# is shared by the dev account.
homebrew_repository = "https://github.com/wignerStan/brew.git"
homebrew_branch = "overlay-store"

[machine."jacob@incus"]
ownership = "personal"
platform = "local"
tier = "default"
facets = ["dev", "ai", "research", "trade"]
bootstrap = "full"
deploy = "user"
is_guest = false
# Jacob has a separate home; do not route his caches or mamba root into the
# dev-owned /develop workspace.
homebrew_repository = "https://github.com/wignerStan/brew.git"
homebrew_branch = "overlay-store"
# Jacob owns the shared base. His user deployment reconciles the standard
# package set there; other accounts inherit it through their private overlays.
homebrew_manage_base = true

[machine."comp@incus"]
ownership = "personal"
platform = "local"
tier = "advanced"
facets = ["hpc", "research"]
bootstrap = "full"
deploy = "user"
is_guest = false
# The computation account can read /develop through the dev group, but
# /develop/cache is intentionally dev-owned and not writable by comp. Keep all
# mutable package, cache, and environment state inside /home/comp.
homebrew_repository = "https://github.com/wignerStan/brew.git"
homebrew_branch = "overlay-store"

[machine."racknerd"]
ownership = "personal"
platform = "cloud"
tier = "simple"
facets = ["proxy", "ai"]
bootstrap = "basic"
deploy = "system+user"
# Cloud workspace: profiles without an explicit shared_cache derive it as
# <shared_workspace>/.cache (single filesystem for cache-to-venv reflinks).
shared_workspace = "/develop"

[machine."nscc"]
ownership = "work"
platform = "cloud"
tier = "default"
facets = ["hpc"]
bootstrap = "basic"
