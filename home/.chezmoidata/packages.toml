# Shared package manifest — layers across BOTH local & cloud hosts via the
# deploy scope (system.* = apt/apk, elevated, run under system/system+user;
# user tooling = brew/static, run from the user scope). NO local/cloud-isolated
# lists — overlays only.
#
# Nested under [packages] so chezmoi's flat .chezmoidata merge exposes
# .packages.brew.l2 / .packages.facets.* (matches templates).
#
# L1 = self-bootstrap (scripts/bootstrap-l1.sh — NOT chezmoi-rendered).
# L2 = basic — all non-simple tiers (shell/dir tools; NO language stack).
# L3 = standard — bootstrap=full: language base and generally useful tooling.
# facets.* = stackable capability overlays (dev/proxy/ai/hpc/research/trade), any tier.
# tiers.advanced = costly/specialist tools added only for an advanced profile.
# system.* = root/system-scoped (install only when running as root/system).

[packages.brew]
l2 = [
  "zsh", "zsh-autosuggestions", "zsh-syntax-highlighting", "zsh-history-substring-search",
  "autossh", "fish", "nushell", "fisher", "tmux",
  "starship", "zoxide", "eza", "bat", "carapace",
  "ripgrep", "fd", "fzf", "jq", "yq", "jo",
  "coreutils", "direnv", "htop", "tree", "wget",
  "age", "gnupg", "fastfetch",
  "vim", "shellcheck", "shfmt", "stylua",
  "p7zip", "sevenzip", "perl", "chezmoi", "parallel",
]
l3 = [
  "uv", "micromamba", "node",
  "ruff", "luarocks",
  "biome", "pyright", "typescript", "typescript-language-server", "pre-commit",
  "neovim", "aria2",
  "ffmpeg", "imagemagick",
  "lazygit", "lazydocker", "yazi",
  "gh", "glab", "git-delta", "git-filter-repo", "gitleaks",
  "pandoc",
  "wireshark", "tcpdump", "ast-grep", "bazel",
  "docker", "docker-compose", "docker-credential-helper",
  "kopia", "cloudflared", "wgcf", "syncthing", "rclone",
  "et",
]

# system.* = L2 basic system packages (root-scoped, both apt and apk hosts).
# python3 = the system python (no user-level python install on linux).
[packages.system.apt]
l2 = ["git", "curl", "wget", "tmux", "ripgrep", "fd-find", "fzf", "bat", "neovim", "jq", "htop", "tree", "rsync", "bash-completion", "python3", "python3-pip", "acl"]
l3 = ["nginx", "kopia", "nftables", "software-properties-common"]

[packages.system.apk]
l2 = ["bash", "git", "curl", "wget", "tmux", "ripgrep", "fd", "fzf", "bat", "neovim", "jq", "htop", "tree", "rsync", "python3", "py3-pip", "acl"]
l3 = ["nginx", "kopia", "nftables"]

# ── Facet overlays (any tier may carry them) ─────────────────────────────
[packages.facets.dev]
brew = ["lefthook", "just", "pnpm", "bun"]
apt  = []
apk  = []

# Specialist scanners, cloud tooling, and reverse-engineering packages are not
# part of the standard developer profile. A personal advanced account installs
# these in its user overlay after inherited base packages have been projected.
[packages.tiers.advanced]
brew = ["osv-scanner", "trivy", "supabase", "azure-cli", "binwalk", "lief"]
brew_head = ["radare2"]

[packages.facets.proxy]
brew = ["sing-box", "xray-core"]
apt  = ["xray-core", "sing-box"]
apk  = ["xray-core", "sing-box"]   # alpine coverage varies; best-effort only

[packages.facets.ai]
brew = ["cc-switch-cli", "beads", "cliproxyapi", "opencode"]
apt  = ["postgresql", "redis-server"]           # sub2api backend needs pg; redis optional
apk  = ["postgresql", "redis"]

[packages.facets.research]
brew = ["pixi"]
apt  = []
apk  = []

[packages.facets.trade]
brew = []
apt  = []
apk  = []

[packages.facets.hpc]
brew = ["spack"]
apt  = ["spack"]
apk  = ["spack"]
