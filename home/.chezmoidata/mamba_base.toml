# Mamba base environment — declarative package manifest, per-tier.
# Managed by chezmoi. chezmoi merges .chezmoidata/*.toml into the top-level data
# namespace, so this file's [mamba_base] table is accessible as .mamba_base.* .
#
# Structure: a shared core + per-tier add-ons. The sync script
# (run_onchange_mamba-sync-base.{sh,ps1}) installs:
#   .mamba_base.core.conda / .pip            (always, every machine)
#   + .mamba_base.<tier>.conda / .pip        (the current machine's tier)
# Idempotent (conda/pip no-op already-installed), only ADDS — never removes.
# Triggered by chezmoi run_onchange (no background service).
#
# Keep base minimal — it's the shared Python runtime. Project deps belong in
# per-project envs (uv/pixi/mamba -n). pywinauto is NOT here: the Windows
# bootstrap installs it when tier is simple/develop OR profile is work.

[mamba_base]
channels = ["conda-forge"]   # conda-forge first for sharded repodata (see dot_condarc.tmpl)

# ── core: every machine with mamba gets these ──────────────────────────────
[mamba_base.core]
conda = ["python", "pip", "jupyterlab"]
pip   = []

# ── standard: data + plotting stack (no heavy ML) ──────────────────────────
# personal desktop / work laptop: numpy/scipy/pandas + matplotlib/seaborn.
[mamba_base.standard]
conda = ["numpy", "scipy", "pandas", "matplotlib", "seaborn"]
pip   = []

# ── develop: full dev tooling on top of standard ───────────────────────────
# add notebook/dev extras; still no heavy ML (use a project env for that).
[mamba_base.develop]
conda = ["jupyterlab-git", "notebook", "ipykernel"]
pip   = ["ruff", "pyright", "mypy"]

# ── simple: VM/container — minimal, no science stack (rides host) ──────────
[mamba_base.simple]
conda = []
pip   = []

# ── hpc/vps: headless — skip the desktop plotting stack ────────────────────
[mamba_base.hpc]
conda = []
pip   = []

[mamba_base.vps]
conda = []
pip   = []
